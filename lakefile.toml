name = "PlasmaLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PlasmaLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "PlasmaLean"

# `meta` code of the certificate builders, compiled to native code (`eval_cert` runs ≈ 10×
# faster than in the interpreter). Only depends on Lean; imported by `PlasmaLean.Certificates`.
[[lean_lib]]
name = "PlasmaLeanMeta"
roots = ["PlasmaLeanMeta.EvalCert"]
precompileModules = true
