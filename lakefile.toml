name = "PlasmaLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PlasmaLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Mathlib comes in transitively through TauCeti (its manifest pins the Mathlib commit).
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "v4.35.0"

[[lean_lib]]
name = "PlasmaLean"

# Reads tasks as JSON lines and answers them with the `@[response]` handlers of `PlasmaLean`
# (`PlasmaLean/ResponseExt.lean`, `PlasmaLean/Elaborate.lean`, `PlasmaLean/TaskHandlers.lean`):
# `lake exe theory_loop`. The executables import only `PlasmaLean.TaskHandlers` at build time,
# so building them never rebuilds the whole library; at run time they load `Mathlib` and the
# already-built `PlasmaLean` (bring it up to date by frontier first; see Workstation.md budget).
[[lean_exe]]
name = "theory_loop"
root = "theory_loop"
supportInterpreter = true

# The same tasks over HTTP, with a web page for trying them: `lake exe theory_server [port]`.
[[lean_exe]]
name = "theory_server"
root = "theory_server"
supportInterpreter = true

# `meta` code of the certificate builders, compiled to native code (`eval_cert` runs ≈ 10×
# faster than in the interpreter). Only depends on Lean; imported by `PlasmaLean.Certificates`.
[[lean_lib]]
name = "PlasmaLeanMeta"
roots = ["PlasmaLeanMeta.EvalCert"]
precompileModules = true
